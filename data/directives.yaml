# Jeu d'instructions (code B) — source : B61 tables p.62-66 (voir docs/ISA.md).
# status: known = lu dans une source ; hypothesis = choix par défaut (voir UNKNOWNS.md).
# Les encodages binaires (code A) ne sont PAS connus : voir U-01, encoding.yaml (J5).

cuts:            # T.O. 4 caractères ; cc = conditions JOIN supplémentaires (0-3)
  ARIT: {element: arithmetic,  numbered: false}
  LOGI: {element: logical,     numbered: false}
  TRAN: {element: transcoder,  numbered: false}
  COMP: {element: comparator,  numbered: false}
  DRUM: {element: drum,        numbered: true}
  CARR: {element: card_reader, numbered: true}
  CARP: {element: card_reader_punch, numbered: true}
  PRIN: {element: printer,     numbered: true}
  MATA: {element: uniselector, numbered: true}
  TAPR: {element: paper_tape_reader, numbered: true}
  TAPP: {element: paper_tape_punch,  numbered: true}
  DESK: {element: desk,        numbered: true}
  PROT: {special: virtual_engage,  x: virtual_element_image}
  LIBE: {special: virtual_release, x: virtual_element_image}
  SIMU: {special: fork,            x: second_branch_address}
  STOP: {special: end_of_sequence}

branches:        # T.O. 2 chiffres
  "00": never
  "31": always
  conditional_range: [1, 24]   # teste le bit n du registre A

address_instructions:   # cc = n° de CAR (0-3)
  L: load
  P: place
  A: add
  S: subtract

central_directives:     # exécutées par le DP ; status partiel (U-15)
  PI: {name: place_instruction_number, status: known_name}
  IC: {name: iteration_control,        status: known_name}
  CP: {name: counter_progression,      status: known_name}
  TA: {name: transfer_to_A,            status: known}
  PA: {name: place_A,                  status: known}
  TB: {name: transfer_to_B,            status: known}
  PB: {name: place_B,                  status: known}
  LB: {name: load_B_15,                status: known}
  AB: {name: add_B_15,                 status: known}
  SB: {name: subtract_B_15,            status: known}
  CB: {name: compare_B_15,             status: known}
  SQ: {name: substitute_quantity_in_B, status: known_name}
  SI: {name: substitute_instruction,   status: known_name}
  SN: {name: switch_branch_never,      status: known}
  SA: {name: switch_branch_always,     status: known}
  RR: {name: reverse_switches,         status: known_name}
  FZ: {name: fill_zeros,               status: known}
  FO: {name: fill_ones,                status: known}

elements:
  arithmetic:
    registers: {P: 2, S: 2, O: 2}          # en catènes
    cars: 4                                # 0-3 avec progression, Z F S T sans progression
    operand_designators: ["0", "1", "2", "3", "Z", "F", "S", "T", "P"]
    cc1_values: {P: programmed_point, N: normalized, R: normalized_rounded, A: normalized_rounded}  # COURS p.68 (A) ; B61 (R)
    cc2_values: {D: double_length}
    qualitative_compare_bits: {1: ">", 2: "<", 3: "=", 4: ">=", 5: "<=", 6: "!="}           # B61 p.35 ; COURS p.72
    directives: [ADD, SUB, MUL, DIV, DIR, TRA, MPT, DPT, RSI, AVA, CAV, CAL, ROF]
  logical:
    registers: {K: 1, L: 1}
    cars: 4
    directives: [TSK, TSL, TKL, SHL, IKL, FZL, FOL, ADD, SUB, MUL, DIV, FLC, INT, REU, BLC]
  comparator:
    cars: 3                                # CAR0 variable/1er terme ; CAR1, CAR2 bornes/2e terme
    max_length: 255
    directives: [OWC, TWC, DEL, TSS]
  transcoder:
    cars: {0: source, 1: destination, 2: cliche}
    mic_entries: 256                       # U-12
    directives: [MIC, BCP, ICP, BCS, ICS, PBC, PTP, PPT, PPR, PTS, STP, STS, RCL, END]
    cliches:
      positioning: [AW, NW, AN, NS, BN, AZ]
      execution:   [TO, TN, IO, IN, OO, ON, WO, WN, RO, RN, RP, CQ]
  drum:
    cars: 1
    directives: [DAO, TCD, TDC]
    shareable: true
  uniselector:
    cars: 1
    directives:
      preparatory: [WRI, REF, REB]
      execution:   [TRA, JUM, DEL, WRM]
      service:     [SPO, SPN, MAI, MAN]
    shareable: false
  card_reader:
    directives: [SPR, SPP, REA, CLE, DMF, DMI]
    shareable: false
  card_reader_punch:
    directives: [SPR, SPP, REA, PUN, CLE, DMF, DMI]
    shareable: false
  printer:
    directives: [SKI, PRI, DMF, DMI]
    shareable: false
  paper_tape_reader:
    directives: [REA, DMN, DMI]
    shareable: false
  paper_tape_punch:
    directives: [PUN, DMN, DMI]
    shareable: false

french_aliases:   # profil COURS (voir docs/ISA.md §7)
  cuts: {TRAD: TRAN, TAMB: DRUM, LECT: CARR, PECT: CARP, IMPR: PRIN, DERU: MATA, LEBA: TAPR, PEBA: TAPP}
  address: {G: L, R: P, A: A, S: S}
  central: {RI: PI, RA: PA, RB: PB, GB: LB, FT: SA, FJ: SN, FI: RR, FU: FO, DI: IC, PC: CP, GE: GE, RE: RE}
  arithmetic: {SOU: SUB, TER: TRA, MPD: MPT, DPD: DPT, ISI: RSI, PVA: AVA, CVA: CAV, ARR: ROF}
  logical: {TCK: TSK, TCL: TSL, MCL: SHL, FUL: FOL, FCL: FLC, SOU: SUB, CNL: BLC}
  comparator: {CMP: OWC, CDB: TWC, EFL: DEL, TRR: TSS}
special_cuts_cours: {A: no_release_of_requester, B: no_busy_check}
