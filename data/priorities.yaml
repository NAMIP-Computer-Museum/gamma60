# Ordres de priorité — U-03, U-04, U-16. Premier = plus prioritaire.
dtd:
  sources: ["B61 p.24 : préétabli selon la nature ; tambour > ARIT",
            "COURS p.6 : à nature égale, quantités avant instructions ; DP avant COMP quand il alimente un lecteur de cartes"]
  status: hypothesis
  unknown: U-03   # place du DP : U-16
  order: [drum, uniselector, card_reader, card_reader_punch, printer,
          paper_tape_reader, paper_tape_punch, transcoder, comparator,
          arithmetic, logical, desk]
  program_distributor_fetch: "rang de l'élément servi, juste après ses propres demandes de quantités"
  nature_order: [quantity, instruction]   # à nature égale [COURS p.6]
  tie_break:                    # deux demandes de même rang (ex. deux tambours)
    value: configuration_order  # ordre des éléments dans la configuration (tambours n° 100+ : COURS p.51)
    status: hypothesis
    unknown: U-41
dti:
  source: "B61 p.24 ; MAIT : classes à priorité décroissante"
  status: hypothesis
  unknown: U-04
  by_class: [0, 1, 2, 3, 4]
