# Codage des instructions en code A — source COURS p.33-52 (préfixes et champs).
# Les valeurs des sous-codes marquées synthetic: true sont RECONSTRUITES (U-01) :
# stables, documentées, à remplacer dès qu'une source les donne.
bits: {numbering: "1 = poids faible (droite) ... 24 = poids fort (gauche)"}
address_function: {d_bit: 17, s_bit: 16, order: "d puis s", negative_offset: "complément à 32768"}
types:
  branch:      {tk: "00",   tk_bits: [24, 23], fields: {condition: [22, 18], d: 17, s: 16, x: [15, 1]},
                conditions: {never: 0, bits_of_A: [1, 24], always: 31}}
  cut:         {tk: "01",   tk_bits: [24, 23], fields: {kind: [22, 20], join_m: [19, 18], d: 17, s: 16, x: [15, 1]}}
  central:     {tk: "10",   tk_bits: [24, 23], fields: {directive: [22, 18], d: 17, s: 16, x: [15, 1]}}
  address:     {tk: "110",  tk_bits: [24, 22], fields: {op: [21, 20], car: [19, 18], d: 17, s: 16, x: [15, 1]}}
  element_directive:
               {tk: "1111", tk_bits: [24, 21],
                with_free_variable: {type: [20, 18], d: 17, s: 16, x: [15, 1]},
                without_free_variable: {characteristic: [20, 1]}}
  undocumented: {tk: "1110", note: "non documenté (U-24)"}
blank_catena_rule: "7 bits de gauche à 0 => exécuté comme branchement « jamais » (COURS p.42)"
synthetic_subcodes:
  synthetic: true
  status: hypothesis
  unknown: U-01
  cut_kind: {normal: 0, no_release: 1, no_busy_check: 2, PROT: 3, LIBE: 4, SIMU: 5, STOP: 6}
  address_op: {load: 0, place: 1, add: 2, subtract: 3}
  central_directive:   # clés = identifiants de directives.yaml (indépendants de la langue)
    {store_instruction_number: 0, load_element_number: 1, store_element_number: 2,
     transfer_to_A: 3, place_A: 4, transfer_to_B: 5, place_B: 6, load_B_15: 7, add_B_15: 8,
     subtract_B_15: 9, compare_B_15: 10, substitute_quantity_in_B: 11, substitute_instruction: 12,
     switch_branch_always: 13, switch_branch_never: 14, reverse_switches: 15, fill_ones: 16,
     fill_zeros: 17, iteration_control: 18, counter_progression: 19}

# Disposition des directives d'ARIT et de LOGI (TK 1111, « sans variable libre », bits 20-1) :
# RECONSTRUITE (U-01). Directive = rang dans directives.yaml (elements.<élément>.directives).
# Désignateurs : 0-3 RAC avec progression, 4-7 RAC 0-3 sans progression (Z U D T / Z F S T),
# 8 = registre (P pour ARIT, L pour LOGI) ; un champ inutilisé par la directive vaut 0.
element_layouts:
  synthetic: true
  status: hypothesis
  unknown: U-01
  arithmetic:
    directive: [20, 17]       # 13 directives
    mode_point: [16, 12]      # 0-15 : sans C.C.1, V = 0-15 ; 16-26 : P, V = 0-10 ; 27 : N ; 28 : A
    double: 11                # C.C.2 D
    operands: [10, 1]         # O1 × 72 + O2 × 9 + R (O1, R : 9 valeurs ; O2 : 8, pas de P)
  logical:
    directive: [20, 17]       # 15 directives
    length: [16, 12]          # l = 0-24
    r: [11, 8]                # R : 0-8
