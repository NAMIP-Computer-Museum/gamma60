# Raccordement des éléments aux canaux DDC / DCC (BAT72 fig. 1).
# Sources : ONDE §2.1, §3.4-3.5 ; BAT72 p.100-101 ; MAIT. Une configuration peut surcharger
# « classes » (ex. classe de LOGI).

classes:                     # classe de chaque type d'élément
  desk: 0                    # U-27 (statut d'élément discuté)
  logical:
    value: 0                 # c0 [ONDE ; BAT72] / c1 [MAIT]
    status: hypothesis
    unknown: U-09
  arithmetic: 1
  comparator: 1
  transcoder: 1
  drum: 2
  uniselector: 2
  card_reader: 3
  card_reader_punch: 3
  printer: 3
  paper_tape_reader: 4
  paper_tape_punch: 4

circuits:                    # circuits de raccordement : une vanne sur chaque canal par circuit
  value:
    - {id: c0, classes: [0]}
    - {id: c1, classes: [1]}
    - {id: c2a, classes: [2]}
    - {id: c2b, classes: [2]}
    - {id: c34, classes: [3, 4], multiplexer: true}
  status: hypothesis         # 5 ensembles [ONDE] / « 6 special circuits » [BAT72] / 4 blocs (fig. 1)
  unknown: U-32

multiplexer:                 # classes 3-4 [ONDE §3.4-3.5 ; MACHINE.md §6.3]
  max_elements: 20
  max_per_installation: 2
  service:                   # ordre de service entre les éléments du multiplexeur
    value: round_robin       # à tour de rôle, derrière la vanne unique du circuit c34
    status: hypothesis
    unknown: U-43

circuit_assignment:          # circuit d'un élément quand sa classe en a plusieurs (c2a, c2b)
  value: alternate           # alternance dans l'ordre de la configuration
  status: hypothesis
  unknown: U-32

element_numbers:             # numéro d'élément (RNE, champ X des coupures) du premier élément de chaque type
  value: {desk: 0, logical: 1, arithmetic: 2, comparator: 3, transcoder: 4, drum: 100, uniselector: 10}
  status: hypothesis         # seuls les tambours sont donnés : « à partir de 100 » [COURS p.51]
  unknown: U-44

unit_numbers:                # code B des coupures numérotées : X = numéro de l'unité (tambour k, unisélecteur k)
  value:                     # → numéro d'élément = premier numéro + pas × (k - 1)
    drum: {first: 100, step: 1}
    uniselector: {first: 10, step: 1}   # X = n° d'élément d'unisélecteur 1-20 : 2k-1 et 2k = unisélecteur k [COURS p.147-148]
  status: hypothesis
  unknown: U-44
