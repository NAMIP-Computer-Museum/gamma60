# Raccordement des éléments aux canaux DDC / DCC (BAT72 fig. 1).
# Sources : ONDE §2.1, §3.4-3.5 ; BAT72 p.100-101 ; MAI. Une configuration peut surcharger
# « classes » (ex. classe de LOGI).

classes:                     # classe de chaque type d'élément
  desk: 0                    # U-27 (statut d'élément discuté)
  logical:
    value: 0                 # c0 [ONDE ; BAT72] / c1 [MAI]
    status: hypothesis
    unknown: U-09
  arithmetic: 1
  comparator: 1
  transcoder: 1
  drum: 2
  uniselector: 2
  card_reader: 3
  card_reader_punch: 3
  printer: 3
  paper_tape_reader: 4
  paper_tape_punch: 4

circuits:                    # circuits de raccordement : une vanne sur chaque canal par circuit
  value:
    - {id: c0, classes: [0]}
    - {id: c1, classes: [1]}
    - {id: c2a, classes: [2]}
    - {id: c2b, classes: [2]}
    - {id: c34, classes: [3, 4], multiplexer: true}
  status: hypothesis         # 5 ensembles [ONDE] / « 6 special circuits » [BAT72] / 4 blocs (fig. 1)
  unknown: U-32

multiplexer:                 # classes 3-4 [ONDE §3.4-3.5 ; MACHINE.md §6.3]
  max_elements: 20
  max_per_installation: 2
