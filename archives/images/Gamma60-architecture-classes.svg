<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1c232b" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Bull Gamma 60 — central unit, channels and element classes</title>
  <desc>Redrawing of a Gamma 60 architecture diagram: central memory and central processor (PD, PAR), data collecting channel (DCC) and data distributing channel (DDC), DD/DAR priority logic, and four element classes connected through gates to the two channel buses, with instruction and data transfer request lines.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#1c232b"/>
    </marker>
    <marker id="h" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11z" fill="#ffffff" stroke="#1c232b" stroke-width="1.2"/>
    </marker>
    <g id="gate"><circle r="10" fill="#ffffff" stroke="#1c232b" stroke-width="1.4"/><line x1="-6" y1="7" x2="6" y2="-7" stroke="#1c232b" stroke-width="1.4"/></g>
  </defs>
  <rect width="720" height="800" fill="#ffffff"/>
  <rect x="8" y="8" width="704" height="784" fill="none" stroke="#1c232b" stroke-width="1.5"/>

  <!-- Central memory and central processor -->
  <rect x="40" y="24" width="190" height="72" fill="none" stroke="#1c232b" stroke-width="1.4"/>
  <text x="135" y="54" text-anchor="middle">Central Memory</text>
  <text x="135" y="74" text-anchor="middle">CM</text>
  <rect x="330" y="24" width="190" height="72" fill="none" stroke="#1c232b" stroke-width="1.4"/>
  <rect x="410" y="24" width="55" height="22" fill="none" stroke="#1c232b" stroke-width="1.2"/>
  <rect x="465" y="24" width="55" height="22" fill="none" stroke="#1c232b" stroke-width="1.2"/>
  <text x="437" y="40" text-anchor="middle" font-size="12">PD</text>
  <text x="492" y="40" text-anchor="middle" font-size="12">PAR</text>
  <text x="425" y="66" text-anchor="middle">Central Processor</text>
  <text x="425" y="84" text-anchor="middle">CP</text>
  <line x1="230" y1="48" x2="328" y2="48" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="330" y1="74" x2="232" y2="74" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- DD / DAR priority -->
  <rect x="560" y="112" width="130" height="56" fill="none" stroke="#1c232b" stroke-width="1.4"/>
  <text x="625" y="136" text-anchor="middle">DD  DAR</text>
  <text x="625" y="154" text-anchor="middle">Priority</text>

  <!-- Channels -->
  <rect x="40" y="160" width="120" height="44" fill="none" stroke="#1c232b" stroke-width="1.4"/>
  <text x="100" y="187" text-anchor="middle">DCC</text>
  <rect x="330" y="160" width="120" height="44" fill="none" stroke="#1c232b" stroke-width="1.4"/>
  <text x="390" y="187" text-anchor="middle">DDC</text>
  <!-- DCC to CM, CM to DDC, DCC to CP (crossing), CP to DDC -->
  <line x1="100" y1="160" x2="100" y2="98" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M190 96 L190 120 L360 140 L360 158" fill="none" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
  <path d="M140 160 L140 140 L380 120 L380 98" fill="none" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
  <line x1="420" y1="96" x2="420" y2="158" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Channel buses -->
  <line x1="100" y1="645" x2="100" y2="206" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
  <line x1="390" y1="204" x2="390" y2="645" stroke="#1c232b" stroke-width="3"/>

  <!-- Request and priority lines -->
  <path d="M600 645 L600 70 L524 70" fill="none" stroke="#1c232b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="548" y="64" font-size="12">DTR</text>
  <line x1="650" y1="170" x2="650" y2="606" stroke="#1c232b" stroke-width="1.4"/>
  <line x1="545" y1="214" x2="596" y2="214" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="514" y="218" font-size="12">ITR</text>

  <!-- Class rows: y = box top -->
  <!-- Class 0 -->
  <g>
    <path d="M650 226 L130 226 L130 255" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="345" y1="226" x2="345" y2="255" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="650" y1="226" x2="612" y2="226" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="160" y="240" width="150" height="50" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <text x="235" y="270" text-anchor="middle">Class 0</text>
    <line x1="120" y1="265" x2="102" y2="265" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="140" y1="265" x2="160" y2="265" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="130" y="265"/>
    <line x1="388" y1="265" x2="357" y2="265" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="335" y1="265" x2="310" y2="265" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="345" y="265"/>
    <line x1="355" y1="276" x2="598" y2="276" stroke="#1c232b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="170" y="310" font-size="12">• Console Typewriter</text>
    <text x="170" y="326" font-size="12">• Logical Unit</text>
  </g>
  <!-- Class 1 -->
  <g>
    <path d="M650 356 L130 356 L130 385" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="345" y1="356" x2="345" y2="385" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="650" y1="356" x2="612" y2="356" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="160" y="370" width="150" height="50" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <text x="235" y="400" text-anchor="middle">Class 1</text>
    <line x1="120" y1="395" x2="102" y2="395" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="140" y1="395" x2="160" y2="395" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="130" y="395"/>
    <line x1="388" y1="395" x2="357" y2="395" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="335" y1="395" x2="310" y2="395" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="345" y="395"/>
    <line x1="355" y1="406" x2="598" y2="406" stroke="#1c232b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="170" y="440" font-size="12">• Generalized Comparator</text>
    <text x="170" y="456" font-size="12">• Arithmetic Unit</text>
    <text x="170" y="472" font-size="12">• Transcoder</text>
  </g>
  <!-- Class 2 -->
  <g>
    <path d="M650 486 L130 486 L130 515" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="345" y1="486" x2="345" y2="515" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="650" y1="486" x2="612" y2="486" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="160" y="500" width="150" height="50" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <text x="235" y="530" text-anchor="middle">Class 2</text>
    <line x1="120" y1="525" x2="102" y2="525" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="140" y1="525" x2="160" y2="525" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="130" y="525"/>
    <line x1="388" y1="525" x2="357" y2="525" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="335" y1="525" x2="310" y2="525" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="345" y="525"/>
    <line x1="355" y1="536" x2="598" y2="536" stroke="#1c232b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="170" y="570" font-size="12">• Magnetic Drum Units</text>
    <text x="170" y="586" font-size="12">• Magnetic Tape Units</text>
  </g>
  <!-- Class 3,4 -->
  <g>
    <path d="M650 606 L130 606 L130 635" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="345" y1="606" x2="345" y2="635" stroke="#1c232b" stroke-width="1.4"/>
    <line x1="650" y1="606" x2="612" y2="606" stroke="#1c232b" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="160" y="620" width="150" height="50" fill="none" stroke="#1c232b" stroke-width="1.4"/>
    <text x="235" y="650" text-anchor="middle">Class 3,4</text>
    <line x1="120" y1="645" x2="102" y2="645" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="140" y1="645" x2="160" y2="645" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="130" y="645"/>
    <line x1="388" y1="645" x2="357" y2="645" stroke="#1c232b" stroke-width="3" marker-end="url(#h)"/>
    <line x1="335" y1="645" x2="310" y2="645" stroke="#1c232b" stroke-width="3"/>
    <use href="#gate" x="345" y="645"/>
    <line x1="355" y1="656" x2="598" y2="656" stroke="#1c232b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="170" y="690" font-size="12">• Unit Record Multiplexor</text>
    <text x="170" y="706" font-size="12">• Card Readers</text>
    <text x="170" y="722" font-size="12">• Punches and Printers</text>
    <text x="170" y="738" font-size="12">• Paper Tape Readers and Punches, Typewriters</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="768" x2="80" y2="768" stroke="#1c232b" stroke-width="3"/>
  <text x="88" y="772" font-size="11">data channels</text>
  <line x1="190" y1="768" x2="230" y2="768" stroke="#1c232b" stroke-width="1.4"/>
  <text x="238" y="772" font-size="11">priority / gate control</text>
  <line x1="380" y1="768" x2="420" y2="768" stroke="#1c232b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="428" y="772" font-size="11">transfer requests</text>
  <use href="#gate" x="560" y="768" transform="translate(560 768) scale(0.7) translate(-560 -768)"/>
  <text x="572" y="772" font-size="11">gate</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
