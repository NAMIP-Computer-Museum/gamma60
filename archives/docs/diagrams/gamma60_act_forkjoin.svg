<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="698px" preserveAspectRatio="none" style="width:733px;height:698px;background:#FFFFFF;" version="1.1" viewBox="0 0 733 698" width="733px" zoomAndPan="magnify"><title>act [Programme] FORK / JOIN en code B (mn&#233;moniques B61)</title><defs/><g><text fill="#000000" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="476.5264" x="127.0083" y="32.9951">act [Programme] FORK / JOIN en code B (mn&#233;moniques B61)</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="255.8008" x="237.3711" y="49.292">a = b&#215;c ; d = d+e ; f = a&#215;d &#8212; v7</text><ellipse cx="236.8057" cy="73.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FDFDFD" height="47.9375" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="222.5234" x="125.5439" y="103.5938"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="169.1543" x="135.5439" y="124.7324">SIMU   I2 R  + cat&#232;ne vierge</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="202.5234" x="135.5439" y="138.7012">(lance la suite I1 et la branche I2)</text><path d="M472.6113,245.8516 L472.6113,316.3828 L721.543,316.3828 L721.543,255.8516 L711.543,245.8516 L472.6113,245.8516 " fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M711.543,245.8516 L711.543,255.8516 L721.543,255.8516 L711.543,245.8516 " fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129.3208" x="478.6113" y="262.9185">I3 : ARIT, C.C. = 1</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="187.1987" x="478.6113" y="278.0513">1 condition suppl&#233;mentaire :</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="219.2861" x="478.6113" y="293.1841">la coupure n'agit qu'au 2e appel ;</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacing" textLength="227.9316" x="478.6113" y="308.3169">la cat&#232;ne vierge compte les appels</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="451.6113" x="11" y="171.5313"/><rect fill="none" height="179.1719" style="stroke:#000000;stroke-width:1.5;" width="198.8477" x="23" y="187.5313"/><path d="M46.0361,187.5313 L46.0361,196.8281 L36.0361,206.8281 L23,206.8281 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="13.0361" x="26" y="201.5264">I1</text><rect fill="#FDFDFD" height="61.9063" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="178.8477" x="33" y="223.8281"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="131.5078" x="43" y="244.9668">ARIT  + cat&#232;ne vierge</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="113.5547" x="43" y="258.9355">L 0 B &#183; L 1 C &#183; L 2 A</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="158.8477" x="43" y="272.9043">MUL N - 0 1 2   (a = b &#215; c)</text><rect fill="#FDFDFD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="136.1504" x="54.3486" y="320.7344"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="116.1504" x="64.3486" y="341.873">31  I3 R   (toujours)</text><rect fill="none" height="179.1719" style="stroke:#000000;stroke-width:1.5;" width="200.7637" x="249.8477" y="187.5313"/><path d="M272.8838,187.5313 L2