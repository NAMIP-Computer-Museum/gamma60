le="stroke:#333333;stroke-width:0.5;" width="226.3994" x="174" y="257.2969"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="212.3994" x="181" y="272.292">registre C d'ARIT (MC) : queue</text><line style="stroke:#333333;stroke-width:0.5;" x1="175" x2="399.3994" y1="277.5938" y2="277.5938"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="104.4189" x="180" y="294.5889">&#8594; vierge de S3</text></g><g id="elem_s1"><rect fill="#E8F5E9" height="60.8906" style="stroke:#333333;stroke-width:0.5;" width="227.5645" x="7" y="332.2969"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="127.7705" x="56.897" y="347.292">S1 : cat&#232;ne vierge</text><line style="stroke:#333333;stroke-width:0.5;" x1="8" x2="233.5645" y1="352.5938" y2="352.5938"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="179.8193" x="13" y="369.5889">bits 1-15 : &#8594; vierge de S2</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="215.5645" x="13" y="385.8857">bits 19-18 : compteur JOIN = 0</text></g><g id="elem_s2"><rect fill="#E8F5E9" height="44.5938" style="stroke:#333333;stroke-width:0.5;" width="191.8193" x="39" y="454.2969"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="127.7705" x="71.0244" y="469.292">S2 : cat&#232;ne vierge</text><line style="stroke:#333333;stroke-width:0.5;" x1="40" x2="229.8193" y1="474.5938" y2="474.5938"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="179.8193" x="45" y="491.5889">bits 1-15 : &#8594; vierge de S3</text></g><g id="elem_s3"><rect fill="#E8F5E9" height="44.5938" style="stroke:#333333;stroke-width:0.5;" width="141.7705" x="140" y="560.2969"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacin